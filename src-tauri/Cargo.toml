[package]
name = "wp-maintenance-manager"
version = "0.1.0"
description = "Veilige lokale WordPress onderhoudsapp via SSH en WP-CLI"
authors = ["WP Maintenance Manager contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wp_maintenance_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
email_address = "0.2"
flate2 = "1.1"
getrandom = "0.3"
keyring = { version = "4.1", default-features = false, features = ["v1", "windows-native-keyring-store"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11"
ssh2 = "0.9.6"
subtle = "2.6"
thiserror = "2"
url = "2"
uuid = { version = "1.25", features = ["v4", "serde"] }
